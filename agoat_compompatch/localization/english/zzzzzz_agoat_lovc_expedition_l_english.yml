 agoat_lovc_fund_expedition_0001_t:0 "Funding an Expedition"
 agoat_lovc_fund_expedition_0001_desc:0 "I have decided to go on an expedition, obtaining needed maps of chartered regions around the Basilisk Isles and planning out how much provisions I will be needing. Now I must decide on a destination. Between Gogossos and Sothoryos, the former is the safer option though much less likely to yield any valuables. I could take the more treacherous path and head to Sothoryos, whose mostly untouched lands are bound to be ripe with treasure, yet teeming with even greater dangers deep within."
