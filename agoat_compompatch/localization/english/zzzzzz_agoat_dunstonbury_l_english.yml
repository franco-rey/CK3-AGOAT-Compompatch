l_english:
 building_agot_dunstonbury_02:0 "The Old Castle"
 building_agot_dunstonbury_02_desc:0 "Dunstonbury, House Manderly's ancient seat, has been rightfully restored to the Merman's control. While House Manderly built the New Castle in the North in remembrance of it, the Old Castle now stands once more as a beacon to the house."
