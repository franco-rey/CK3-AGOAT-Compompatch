l_english:
 tradition_agot_vineman_name:0 "Wine, Women, and Song"
 tradition_agot_vineman_desc:0 "Ever since the coming of Gilbert of the Vines, the men of the Arbor have known but one thing: wine. The vineyards of the Arbor are legendary in Westeros and beyond for the quality wine they produce, and many a merchant and sailor set their anchors in Ryamsport to buy the finest Arbor reds."
