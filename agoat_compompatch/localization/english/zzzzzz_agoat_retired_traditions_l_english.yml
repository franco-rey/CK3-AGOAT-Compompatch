l_english:
 tradition_agot_reachman_name:0 "Greenhand's Glory"
 tradition_agot_reachman_desc:0 "The Reach is a prosperous and fertile land built on the backs of hardworking smallfolk. It is also a land of families with some of the oldest roots in Westeros, dating back to the mythical Garth Greenhand, from whom most prominent Reachmen families claim descent. With so many families striving for prominence in a wealthy land, the ties that bind them are stronger and more important than elsewhere in Westeros."
 tradition_agot_moon_clan_name:0 "Above the Setting Sun"
 tradition_agot_moon_clan_desc:0 "In the depths of the Mountains of the Moon dwell its clansmen, the most savage and uncivilized men anywhere south of the Wall. They are the last true remnants of the First Men in the Vale, their mountainous home protecting them from the onslaught of the Andals, leaving them to continue their primitive ways without much outside intervention."
 tradition_agot_thenn_name:0 "The Last of the First"
 tradition_agot_thenn_desc:0 "Known as the more 'sophisticated' of the free folk by those south of the Wall, the Thenns consider themselves to be the last remaining First Men. The inhabitants of the mountain valley in the Frostfangs interact more with giants than with other cultures but have managed to learn the occasional word or sentence in Common Tongue, despite having never deviated from the Old Tongue they still speak today. Priding themselves in their belief in Magnar, the Thenn are somewhat more disciplined and organized than other free folk, and have managed to amass an impressive bronze armory. While those south of the Wall may consider the Thenn to be savage, they are more than capable, often coming into conflict with the Night's Watch."
 tradition_agot_westerman_name:0 "Of Gold and Silver"
 tradition_agot_westerman_desc:0 "The Westerlands, at first glance, seem like a paltry place; not the largest or most populous of the Seven Kingdoms, it is nevertheless the wealthiest. What it lacks in rolling fields of fertile farmland, it more than makes up for with the bounty of its hills, rich with gold and silver. It is this abundance of valuable minerals that the power of the Westerlands is built upon, and its nobles jealously guard their mines against those who look on, envious of their wealth."
