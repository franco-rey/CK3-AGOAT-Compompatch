l_english:
 north_ring_name:0 "The Snowborn Oathband"
 north_ring_description:0 "This signet ring is given only to members of the White Wolf bloodline when they come of age. The Oathband symbolizes the sacred pact between man and winter—strength, endurance, and sacrifice. Its pale wolf engraving is rumored to warm against the skin when its bearer faces a choice of honor, guiding them toward the path taken by their forebears."
 north_necklace_name:0 "The Frostbound Howl"
 north_necklace_description:0 "Said to be forged in the Age of the Dawn, this necklace bears the visage of the First White Wolf, a spirit-beast that guided the early Stark ancestors through the Long Night. Passed down only to those “chosen by winter,” the medallion is believed to grant its wearer the wolf’s uncanny intuition—warning them of betrayal and danger through brief flashes of icy clarity. Some swear the wolf’s eyes glow faintly when others speak lies."
 north_pin_name:0 "The Ghostclaw Brooch"
 north_pin_description:0 "Once worn by an ancient Stark warden known as “Ice-Hand,” the Ghostclaw Brooch is said to have been crafted from the tooth of a direwolf whose fur was white as moonlit snow. Those who pin it to their cloak are believed to walk half in the realm of the living and half in the realm of spirits. It is often used as a badge of office for those who deal with the mysteries beyond the Wall."
 north_belt_name:0 "The Winterfang Girdle"
 north_belt_description:0 "Carved from hardened leather and bound with iron older than the Wall itself, the Winterfang Girdle was traditionally worn by commanders of the Shadow March. Its buckle bears the White Wolf sigil, representing loyalty to the pack above all else. Legend claims the girdle tightens of its own accord in moments of fear, stiffening the wearer’s resolve and steadying their breath in battle."
 north_journal_name:0 "The Chronicle of the Winterborn"
 north_journal_description:0 "An ancient leather-bound tome marked with the White Wolf sigil, it records the history, myths, and prophecies of the Winterborn—an early Northern bloodline guided by a great white direwolf spirit during the Long Night. Its moonlit silver ink hints at a future “White Wolf King” destined to unite the North. Owning the book symbolizes legitimacy and authority over this ancient, winter-touched lineage."
